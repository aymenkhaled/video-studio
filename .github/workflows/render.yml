name: render

on:
  workflow_dispatch:
    inputs:
      comp:
        description: Composition id
        required: true
        default: Smoke
      chunks:
        description: Parallel chunks (1-256; max 20 run at once)
        required: true
        default: '1'
      mode:
        description: stills = storyboard frames only; full = video + QA
        type: choice
        options: [full, stills, media]
        default: full
      props:
        description: Optional input-props JSON path in the repo
        required: false
        default: ''
      timeline:
        description: Optional episode timeline.json (voice + music + sfx); empty = silent video
        required: false
        default: ''
      episode:
        description: Optional episode folder (with package.json) → thumbnails, chapters, SRT, UPLOAD.md
        required: false
        default: ''
      stills:
        description: Stills mode - a count (e.g. 12) or "scenes" (one per scene)
        required: false
        default: '12'
      concurrency:
        description: Browser tabs per render job (empty = CPU count; use 2 for 3D scenes)
        required: false
        default: ''
      publish:
        description: Upload final.mp4 to a GitHub Release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render-${{ inputs.comp }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  plan:
    if: inputs.mode != 'media'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      frames: ${{ steps.plan.outputs.frames }}
      fps: ${{ steps.plan.outputs.fps }}
      width: ${{ steps.plan.outputs.width }}
      height: ${{ steps.plan.outputs.height }}
      codehash: ${{ steps.hash.outputs.codehash }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - id: hash
        name: Code + props hash (scene cache key)
        run: |
          h=$(cat package-lock.json remotion.config.ts $(git ls-files src packages brands | sort) ${{ inputs.props }} 2>/dev/null | sha256sum | cut -c1-16)
          echo "codehash=$h" >> "$GITHUB_OUTPUT"
      - name: Fetch licensed assets (into public/, bundled below)
        run: python3 tools/fetch_assets.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/audio/requirements.txt
      - uses: actions/cache@v4
        if: inputs.timeline != ''
        with:
          path: .cache/kokoro-v1.0
          key: kokoro-v1.0-int8
      - uses: actions/cache@v4
        if: inputs.timeline != ''
        with:
          path: .cache/tts
          key: tts-${{ hashFiles(inputs.timeline) }}
          restore-keys: tts-
      - name: Soundtrack (voice + score + sfx) and caption timings
        if: inputs.timeline != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm espeak-ng
          pip install -q -r packages/audio/requirements.txt
          python packages/audio/soundtrack.py "${{ inputs.timeline }}"
      - name: Licensed art + relief/rivers + depth layers (release media-v1, built by media.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download media-v1 -p media.zip -D .cache --clobber
          unzip -qo .cache/media.zip -d public
          ls public/art | head -40
      - id: plan
        run: node tools/plan.mjs "${{ inputs.comp }}" "${{ inputs.chunks }}" "${{ inputs.props }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: out/
          retention-days: 1
          include-hidden-files: true

  stills:
    if: inputs.mode == 'stills'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci && npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: out/
      - run: node tools/render_stills.mjs ${{ inputs.stills }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Contact sheets (6 per sheet, readable size)
        run: |
          i=0; ls out/stills/*.jpg | sort | split -l 6 - out/stills/batch_
          for b in out/stills/batch_*; do
            i=$((i+1)); args=""; n=0
            while read f; do args="$args -i $f"; n=$((n+1)); done < "$b"
            ffmpeg -v error -y $args -filter_complex "$(for k in $(seq 0 $((n-1))); do printf '[%d:v]scale=640:-2[v%d];' $k $k; done)$(for k in $(seq 0 $((n-1))); do printf '[v%d]' $k; done)xstack=inputs=$n:layout=$(python3 -c "n=$n;print('|'.join(f'{(k%3)*640}_{(k//3)*360}' for k in range(n)))"):fill=0x202020" -frames:v 1 out/stills/sheet_$(printf '%02d' $i).jpg
          done
          rm -f out/stills/batch_*
      - uses: actions/upload-artifact@v4
        with:
          name: stills-${{ inputs.comp }}
          path: out/stills/
          retention-days: 14

  package:
    if: inputs.episode != '' && inputs.timeline != ''
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci && npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: out/
      - name: Thumbnails (3 variants)
        run: node tools/render_thumbs.mjs "${{ inputs.comp }}Thumb" 3
      - name: Chapters, captions, UPLOAD.md
        run: |
          python3 tools/package_episode.py "${{ inputs.timeline }}" out/bundle/public/generated/timing.json "${{ inputs.episode }}" out/package
          # burned-in captions and SRT must match: regenerate the SRT from the same cue logic as the video
          node --experimental-strip-types --no-warnings tools/captions_srt.mjs out/bundle/public/generated/timing.json out/package/captions.srt
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ inputs.comp }}
          path: out/package/
          retention-days: 14

  render:
    if: inputs.mode == 'full'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: out/chunks
          key: chunk-${{ inputs.comp }}-${{ needs.plan.outputs.codehash }}-${{ inputs.chunks }}-${{ matrix.chunk }}
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci && npx remotion browser ensure
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: bundle
          path: out/
      - if: steps.cache.outputs.cache-hit != 'true'
        run: node tools/render_chunk.mjs ${{ matrix.chunk }}
        env:
          RENDER_CONCURRENCY: ${{ inputs.concurrency }}
      - if: steps.cache.outputs.cache-hit == 'true'
        run: echo "chunk ${{ matrix.chunk }} reused from cache (code + props unchanged)"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: out/chunks/
          retention-days: 1

  combine:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: out/chunks/
          merge-multiple: true
      - name: Join chunks (lossless stream copy)
        run: |
          ls out/chunks/*.ts | sort | sed "s|^|file '$PWD/|; s|$|'|" > out/list.txt
          ffmpeg -v error -y -f concat -safe 0 -i out/list.txt -c copy -map_metadata -1 out/video.mp4
          python3 - <<'EOF'
          import glob, json
          s = [json.load(open(f)) for f in sorted(glob.glob('out/chunks/*.json'))]
          if s:
              frames = sum(x['frames'] for x in s); secs = sum(x['seconds'] for x in s)
              print(f"render stats: {len(s)} chunks, {frames} frames, {secs:.0f} job-seconds, mean {frames/secs:.2f} fps/job on {s[0]['cpus']} CPUs")
              print("per chunk fps:", [round(x['fps'], 2) for x in s])
          EOF
      - uses: actions/download-artifact@v4
        if: inputs.timeline != ''
        with:
          name: bundle
          path: out/plan/
      - name: Mux soundtrack (already loudness-normalised in plan)
        if: inputs.timeline != ''
        run: |
          ffmpeg -v error -y -i out/video.mp4 -i out/plan/soundtrack.wav -map 0:v -map 1:a -c:v copy \
            -ar 48000 -ac 2 -c:a aac -b:a 192k -shortest -map_metadata -1 out/final.mp4
          cp out/plan/audio_report.json out/ || true
      - name: Silent final
        if: inputs.timeline == ''
        run: cp out/video.mp4 out/final.mp4
      - name: QA
        run: |
          python3 tools/qa_video.py out/final.mp4 --width ${{ needs.plan.outputs.width }} --height ${{ needs.plan.outputs.height }} \
            --fps ${{ needs.plan.outputs.fps }} --frames ${{ needs.plan.outputs.frames }} \
            ${{ inputs.timeline == '' && '--no-audio' || '' }} ${{ inputs.episode != '' && '--allow-end-freeze 3' || '' }} --sheet out/contact_sheet.jpg --sheet-count 24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-${{ inputs.comp }}
          path: |
            out/final.mp4
            out/final.mp4.qa.json
            out/contact_sheet.jpg
            out/audio_report.json
          retention-days: 7
      - name: Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="render-${{ inputs.comp }}-${{ github.run_id }}"
          gh release create "$tag" out/final.mp4 out/contact_sheet.jpg out/final.mp4.qa.json --title "$tag" --notes "Render of ${{ inputs.comp }} at ${{ github.sha }}" --prerelease

  media:
    if: inputs.mode == 'media'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-src-${{ hashFiles('assets/media.json') }}
          restore-keys: media-src-
      - run: pip install -q numpy==2.2.6 pillow==11.3.0 onnxruntime==1.23.2
      - run: python3 tools/fetch_media.py
      - name: Publish media-v1/media.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public && zip -qr ../media.zip art geo && cd ..
          ls -la media.zip
          gh release view media-v1 >/dev/null 2>&1 || gh release create media-v1 --title "media-v1" --notes "Licensed art (PD / CC0 / CC BY, see docs/LICENSES.md), Natural Earth relief + rivers (PD), derived depth layers. Built by media.yml from assets/media.json."
          gh release upload media-v1 media.zip --clobber
