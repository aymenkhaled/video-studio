name: benchmark

# Measures real render fps per job on GitHub's standard runner for each engine type.
# Each composition renders as ONE job (no chunking) so fps/job is directly usable in estimates.

on:
  workflow_dispatch:
    inputs:
      comps:
        description: JSON list of composition ids
        default: '["Bench2D","Bench3D","Bench25D"]'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        comp: ${{ fromJson(inputs.comps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx remotion browser ensure
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 tools/fetch_assets.py
      - run: node tools/plan.mjs ${{ matrix.comp }} 1
      - name: Render (timed)
        run: node tools/render_chunk.mjs 0
      - name: Stills for visual check (first, middle, last)
        run: node tools/render_stills.mjs 3
      - name: Result
        run: |
          cat out/chunks/chunk-0000.json
          echo "{\"comp\":\"${{ matrix.comp }}\",\"runner\":\"ubuntu-latest\",\"stats\":$(cat out/chunks/chunk-0000.json)}" > out/bench-${{ matrix.comp }}.json
          ffmpeg -v error -y -i out/chunks/chunk-0000.ts -c copy out/${{ matrix.comp }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.comp }}
          path: |
            out/bench-${{ matrix.comp }}.json
            out/stills/
            out/${{ matrix.comp }}.mp4
          retention-days: 7
