name: media

# One-time (and on manifest change) fetch of licensed art + Natural Earth data + 2.5D depth layers.
# Stores the result as release asset media-v1/media.zip so renders never hit Wikimedia rate limits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-src-${{ hashFiles('assets/media.json') }}
          restore-keys: media-src-
      - run: pip install -q numpy==2.2.6 pillow==11.3.0 onnxruntime==1.23.2
      - run: python3 tools/fetch_media.py
      - name: Publish media-v1/media.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public && zip -qr ../media.zip art geo && cd ..
          ls -la media.zip
          gh release view media-v1 >/dev/null 2>&1 || gh release create media-v1 --title "media-v1" --notes "Licensed art (PD / CC0 / CC BY, see docs/LICENSES.md), Natural Earth relief + rivers (PD), derived depth layers. Built by media.yml from assets/media.json."
          gh release upload media-v1 media.zip --clobber
